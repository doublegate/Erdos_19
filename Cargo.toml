[package]
name = "erdos19"
version = "0.1.0"
edition = "2021"
authors = ["Lucas Parobek <parobek@gmail.com>"]
description = "GPU-accelerated exact and structural analysis of Erdős Problem #19 ($500 Decidable Prize, the Erdős–Faber–Lovász Conjecture): primal-dual singleton reduction, De Bruijn–Erdős vs. Vizing tightness dichotomy, and CUDA bitmask chromatic index solver"
license = "MIT"
repository = "https://github.com/doublegate/Erdos_19"
homepage = "https://github.com/doublegate/Erdos_19"
readme = "README.md"
keywords = ["erdos", "erdos-faber-lovasz", "linear-hypergraphs", "chromatic-index", "cuda"]
categories = ["mathematics", "algorithms", "science"]

[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13030",
] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
