name: Lean 4, Python PBD Certificate, & Rust Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lean4-verification:
    name: Lean 4 Formal Proof & Axiom Audit (v4.33.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.1/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build Lean 4 proofs with --wfail
        run: lake --wfail build
      - name: Run Kernel Axiom Audit (#print axioms)
        run: lake env lean Erdos19/AxiomCheck.lean

  python-verification:
    name: Python 3 Three-Tier Discharging & PBD Certificate Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: pip install numpy
      - name: Verify Three-Tier Pair-Budget Closure & 3,091/3,091 PBD Certificates
        run: python3 paper/anc/verify_erdos19_three_tier_closure.py
      - name: Verify Full Theorems 2.1 & 3.1-3.11 Hierarchy
        run: python3 scripts/verify_efl_theorems.py

  rust-suite:
    name: Rust EFL Hypergraph & PBD Census Suite (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Unit & Theorem Certificate Tests
        run: cargo test --release
